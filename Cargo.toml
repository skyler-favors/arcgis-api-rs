[package]
name = "arcgis-sharing-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["Skyler Favors <skylerafavors@gmail.com>"]
description = "Rust client library for the ArcGIS REST API"
license = "MIT OR Apache-2.0"
repository = "https://github.com/skyler-favors/arcgis-rs"
keywords = ["arcgis", "gis", "rest-api", "geospatial"]
categories = ["api-bindings", "web-programming::http-client"]
readme = "README.md"
publish = false

[package.metadata.docs.rs]
features = [
    "default-client"
]

[features]
default = [
    "default-client",
]
default-client = []
error-backtrace = ["snafu/backtrace"]

[dependencies]
arc-swap = "1.8.0"
async-trait = "0.1.89"
bytes = "1.11.0"
chrono = "0.4.42"
futures = "0.3.31"
http = "1.4.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "form", "rustls"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_path_to_error = "0.1.20"
serde_urlencoded = "0.7.1"
snafu = "0.8.9"
tokio = { version = "1.44.2", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.43"
url = "2.5.8"
uuid = { version = "1.16.0", features = ["v4"] }

[dev-dependencies]
dotenvy = "0.15.7"
serial_test = "3.3.1"
